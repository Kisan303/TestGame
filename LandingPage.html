<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Game World</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #080808;
        color: #fff;
        font-family: "Courier New", monospace;
    }

    body {
        overflow-x: hidden;
        background:
            radial-gradient(circle at 50% 20%, #202020 0%, #090909 45%, #000 100%);
    }

    /* Pixel grid */

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.08;

        background-image:
            linear-gradient(#fff 1px, transparent 1px),
            linear-gradient(90deg, #fff 1px, transparent 1px);

        background-size: 24px 24px;
    }

    .container {
        width: min(1200px, 92%);
        margin: auto;
        padding: 60px 0 80px;
        position: relative;
        z-index: 1;
    }

    /* Header */

    .header {
        text-align: center;
        margin-bottom: 60px;
    }

    .pixel-icon {
        font-size: 70px;
        margin-bottom: 15px;

        filter:
            drop-shadow(4px 4px 0 #ff2bd6)
            drop-shadow(-4px -4px 0 #00ffff);

        animation: floating 2s ease-in-out infinite;
    }

    @keyframes floating {
        0%,100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-8px);
        }
    }

    h1 {
        margin: 0;

        font-size: clamp(32px, 6vw, 72px);
        letter-spacing: 5px;

        color: #fff;

        text-shadow:
            5px 5px 0 #ff2bd6,
            -5px -5px 0 #00ffff;
    }

    .subtitle {
        margin-top: 18px;
        color: #aaa;
        font-size: 15px;
        letter-spacing: 3px;
    }

    .status {
        display: inline-block;
        margin-top: 25px;

        padding: 8px 16px;

        border: 2px solid #00ff88;

        color: #00ff88;

        font-size: 12px;
        letter-spacing: 2px;

        background: #00150c;
    }

    /* Game grid */

    #games {
        display: grid;

        grid-template-columns:
            repeat(auto-fit, minmax(260px, 1fr));

        gap: 25px;
    }

    .game {
        position: relative;

        min-height: 210px;

        padding: 25px;

        background:
            linear-gradient(
                135deg,
                #161616,
                #090909
            );

        border: 3px solid #333;

        cursor: pointer;

        transition:
            transform 0.15s,
            border-color 0.15s,
            box-shadow 0.15s;

        image-rendering: pixelated;
    }

    .game:hover {
        transform: translate(-5px, -5px);

        border-color: #00ffff;

        box-shadow:
            7px 7px 0 #ff2bd6,
            -3px -3px 0 #00ffff;
    }

    .game-number {
        position: absolute;

        top: 10px;
        right: 12px;

        color: #444;

        font-size: 12px;
    }

    .game-icon {
        font-size: 48px;
        margin-bottom: 20px;

        filter:
            drop-shadow(3px 3px 0 #000);
    }

    .game-name {
        font-size: 21px;

        color: white;

        margin-bottom: 10px;

        text-transform: uppercase;

        letter-spacing: 2px;
    }

    .game-file {
        color: #666;

        font-size: 11px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .play {
        margin-top: 20px;

        display: inline-block;

        padding: 8px 14px;

        background: #fff;

        color: #000;

        font-weight: bold;

        font-size: 12px;

        letter-spacing: 1px;
    }

    .game:hover .play {
        background: #00ffff;
    }

    /* Loading */

    .loading {
        grid-column: 1 / -1;

        text-align: center;

        padding: 60px;

        color: #00ffff;

        font-size: 16px;

        letter-spacing: 3px;
    }

    .error {
        grid-column: 1 / -1;

        text-align: center;

        padding: 40px;

        border: 2px solid #ff4444;

        color: #ff4444;

        background: #180000;
    }

    /* Footer */

    footer {
        text-align: center;

        margin-top: 70px;

        color: #555;

        font-size: 11px;

        letter-spacing: 2px;
    }

    /* Mobile */

    @media (max-width: 600px) {

        .container {
            padding-top: 35px;
        }

        .pixel-icon {
            font-size: 50px;
        }

        .subtitle {
            font-size: 11px;
        }

        #games {
            grid-template-columns: 1fr;
        }

        .game {
            min-height: 190px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="pixel-icon">🎮</div>

        <h1>GAME WORLD</h1>

        <div class="subtitle">
            WELCOME TO MY PIXEL UNIVERSE
        </div>

        <div class="status" id="status">
            SCANNING GAMES...
        </div>

    </header>


    <main id="games">

        <div class="loading">
            LOADING GAMES...
        </div>

    </main>


    <footer>
        © 2026 • MY GAME WORLD • BUILT WITH HTML / CSS / JAVASCRIPT
    </footer>

</div>


<script>

/*
=========================================================
    CONFIGURATION
=========================================================

    CHANGE THESE TWO VALUES ONLY.
*/

const GITHUB_USERNAME = "KisanRai";

const GITHUB_REPOSITORY = "games";


/*
=========================================================
    GITHUB API
=========================================================
*/

const API_URL =
    `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/`;


/*
=========================================================
    ICONS
=========================================================
*/

const ICONS = [
    "🎮",
    "👻",
    "🚀",
    "⚖️",
    "🪞",
    "💣",
    "🪨",
    "🍎",
    "👁️",
    "🧠",
    "🔥",
    "🌌",
    "🛸",
    "🏃",
    "🎯",
    "🧩"
];


/*
=========================================================
    GAME NAME CLEANER
=========================================================
*/

function cleanName(filename) {

    return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());

}


/*
=========================================================
    GET RANDOM ICON
=========================================================
*/

function getIcon(index) {

    return ICONS[index % ICONS.length];

}


/*
=========================================================
    CREATE GAME CARD
=========================================================
*/

function createGameCard(game, index) {

    const card = document.createElement("div");

    card.className = "game";

    const name = cleanName(game.name);

    card.innerHTML = `

        <div class="game-number">
            #${String(index + 1).padStart(2, "0")}
        </div>

        <div class="game-icon">
            ${getIcon(index)}
        </div>

        <div class="game-name">
            ${name}
        </div>

        <div class="game-file">
            ${game.name}
        </div>

        <div class="play">
            ▶ PLAY GAME
        </div>

    `;


    /*
        Because this dashboard is hosted
        inside the same GitHub Pages site,
        we can simply open the HTML file.
    */

    card.addEventListener("click", () => {

        window.location.href = game.name;

    });


    return card;

}


/*
=========================================================
    LOAD GAMES FROM GITHUB
=========================================================
*/

async function loadGames() {

    const gamesContainer =
        document.getElementById("games");

    const status =
        document.getElementById("status");


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Could not access GitHub repository."
            );

        }


        const files =
            await response.json();


        /*
            Find every HTML file.

            index.html is excluded because
            that's our dashboard.
        */

        const games =
            files
                .filter(file =>
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".html") &&
                    file.name.toLowerCase() !== "index.html"
                )
                .sort((a, b) =>
                    a.name.localeCompare(b.name)
                );


        gamesContainer.innerHTML = "";


        if (games.length === 0) {

            gamesContainer.innerHTML = `
                <div class="error">
                    NO GAMES FOUND.
                </div>
            `;

            status.textContent =
                "0 GAMES FOUND";

            return;

        }


        games.forEach((game, index) => {

            const card =
                createGameCard(game, index);

            gamesContainer.appendChild(card);

        });


        status.textContent =
            `${games.length} GAMES AVAILABLE`;


    } catch (error) {

        console.error(error);

        gamesContainer.innerHTML = `

            <div class="error">

                ⚠️ UNABLE TO LOAD GAMES

                <br><br>

                CHECK YOUR GITHUB USERNAME
                AND REPOSITORY NAME.

            </div>

        `;

        status.textContent =
            "CONNECTION ERROR";

    }

}


/*
=========================================================
    START
=========================================================
*/

loadGames();

</script>

</body>
</html>
