
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kaison's Game World</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    background:
        #050505;

    color: #ffffff;

    font-family:
        "Courier New",
        monospace;

    overflow-x: hidden;

}


/* =========================================================
   PIXEL BACKGROUND
========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 0;

    opacity: 0.07;

    background-image:

        linear-gradient(
            #ffffff 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            #ffffff 1px,
            transparent 1px
        );

    background-size:
        24px 24px;

}


/* =========================================================
   CRT SCANLINES
========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 9999;

    background:

        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container {

    position: relative;

    z-index: 2;

    width:
        min(1200px, 92%);

    margin:
        auto;

    padding:
        55px 0 100px;

}


/* =========================================================
   HEADER
========================================================= */

header {

    text-align:
        center;

    margin-bottom:
        65px;

}

.logo {

    font-size:
        72px;

    margin-bottom:
        20px;

    animation:
        floating 2s ease-in-out infinite;

    filter:

        drop-shadow(
            5px 5px 0 #ff00cc
        )

        drop-shadow(
            -5px -5px 0 #00ffff
        );

}

@keyframes floating {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-10px);

    }

}


h1 {

    margin:
        0;

    font-size:
        clamp(
            32px,
            7vw,
            75px
        );

    letter-spacing:
        5px;

    line-height:
        1.3;

    text-shadow:

        5px 5px 0 #ff00cc,

        -5px -5px 0 #00ffff;

}


.subtitle {

    margin-top:
        25px;

    color:
        #888;

    font-size:
        12px;

    letter-spacing:
        3px;

    line-height:
        2;

}


.game-count {

    display:
        inline-block;

    margin-top:
        25px;

    padding:
        11px 18px;

    border:
        2px solid #00ff88;

    color:
        #00ff88;

    background:
        #00150d;

    font-size:
        11px;

}


/* =========================================================
   GAME GRID
========================================================= */

#games {

    display:
        grid;

    grid-template-columns:

        repeat(
            auto-fit,
            minmax(
                260px,
                1fr
            )
        );

    gap:
        30px;

}


/* =========================================================
   GAME CARD
========================================================= */

.game-card {

    position:
        relative;

    min-height:
        285px;

    padding:
        30px;

    background:

        linear-gradient(
            145deg,
            #191919,
            #080808
        );

    border:
        3px solid #333;

    cursor:
        pointer;

    transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;

    overflow:
        hidden;

}


.game-card::before {

    content:
        "";

    position:
        absolute;

    width:
        120px;

    height:
        120px;

    right:
        -45px;

    top:
        -45px;

    background:
        #00ffff;

    opacity:
        0.04;

    transform:
        rotate(45deg);

}


.game-card:hover {

    transform:
        translate(
            -6px,
            -6px
        );

    border-color:
        #00ffff;

    box-shadow:

        8px 8px 0 #ff00cc,

        -4px -4px 0 #00ffff;

}


.game-number {

    position:
        absolute;

    right:
        15px;

    top:
        15px;

    color:
        #555;

    font-size:
        11px;

}


.game-icon {

    font-size:
        58px;

    margin-bottom:
        25px;

    filter:
        drop-shadow(
            4px 4px 0 #000
        );

}


.game-name {

    font-size:
        19px;

    font-weight:
        bold;

    text-transform:
        uppercase;

    line-height:
        1.5;

    margin-bottom:
        25px;

}


.play-button {

    display:
        inline-block;

    padding:
        12px 17px;

    background:
        #ffffff;

    color:
        #000000;

    font-size:
        11px;

    font-weight:
        bold;

}


.game-card:hover .play-button {

    background:
        #00ffff;

}


/* =========================================================
   ADMIN BUTTON
========================================================= */

.admin-trigger {

    position:
        fixed;

    right:
        20px;

    bottom:
        20px;

    z-index:
        500;

    width:
        48px;

    height:
        48px;

    border:
        2px solid #333;

    background:
        #111;

    color:
        #777;

    font-size:
        20px;

    cursor:
        pointer;

    transition:
        0.2s;

}


.admin-trigger:hover {

    color:
        #00ffff;

    border-color:
        #00ffff;

    box-shadow:
        0 0 15px
        rgba(
            0,
            255,
            255,
            0.3
        );

}


/* =========================================================
   MODAL BACKDROP
========================================================= */

.modal {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    z-index:
        5000;

    background:
        rgba(
            0,
            0,
            0,
            0.88
        );

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

}


.modal.show {

    display:
        flex;

}


/* =========================================================
   MODAL BOX
========================================================= */

.modal-box {

    width:
        min(
            650px,
            100%
        );

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        #101010;

    border:
        3px solid #00ffff;

    box-shadow:

        8px 8px 0 #ff00cc,

        -4px -4px 0 #00ffff;

    padding:
        30px;

}


.modal-title {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        30px;

}


.modal-title h2 {

    margin:
        0;

    font-size:
        20px;

    color:
        #00ffff;

}


.close {

    background:
        transparent;

    color:
        #777;

    border:
        0;

    font-size:
        25px;

    cursor:
        pointer;

}


.close:hover {

    color:
        #ff00cc;

}


/* =========================================================
   FORM
========================================================= */

.form-label {

    display:
        block;

    margin-bottom:
        9px;

    color:
        #00ffff;

    font-size:
        11px;

}


input {

    width:
        100%;

    padding:
        15px;

    margin-bottom:
        22px;

    border:
        2px solid #444;

    background:
        #050505;

    color:
        #ffffff;

    outline:
        none;

    font-family:
        inherit;

    font-size:
        13px;

}


input:focus {

    border-color:
        #00ffff;

}


/* =========================================================
   EMOJI SELECTOR
========================================================= */

.emoji-title {

    margin-bottom:
        12px;

    color:
        #00ffff;

    font-size:
        11px;

}


.emoji-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                48px,
                1fr
            )
        );

    gap:
        8px;

    margin-bottom:
        25px;

}


.emoji-button {

    height:
        48px;

    border:
        2px solid #333;

    background:
        #080808;

    font-size:
        25px;

    cursor:
        pointer;

    transition:
        0.12s;

}


.emoji-button:hover {

    border-color:
        #00ffff;

    transform:
        scale(1.08);

}


.emoji-button.selected {

    border-color:
        #ff00cc;

    background:
        #211020;

    box-shadow:
        0 0 10px
        rgba(
            255,
            0,
            204,
            0.4
        );

}


/* =========================================================
   ADD BUTTON
========================================================= */

.add-button {

    width:
        100%;

    padding:
        17px;

    border:
        0;

    background:
        #ffffff;

    color:
        #000000;

    font-family:
        inherit;

    font-weight:
        bold;

    font-size:
        12px;

    cursor:
        pointer;

}


.add-button:hover {

    background:
        #00ffff;

}


/* =========================================================
   ADMIN GAME LIST
========================================================= */

.admin-list {

    margin-top:
        35px;

    border-top:
        1px solid #333;

}


.admin-list-title {

    margin:
        25px 0 15px;

    color:
        #ff00cc;

    font-size:
        12px;

}


.admin-game {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

    padding:
        15px 0;

    border-bottom:
        1px solid #292929;

}


.admin-game-info {

    min-width:
        0;

}


.admin-game-name {

    font-size:
        12px;

    margin-bottom:
        7px;

}


.admin-game-url {

    color:
        #666;

    font-family:
        Arial,
        sans-serif;

    font-size:
        11px;

    word-break:
        break-all;

}


.delete-button {

    flex-shrink:
        0;

    padding:
        9px 12px;

    border:
        0;

    background:
        #ff3333;

    color:
        white;

    font-family:
        inherit;

    font-size:
        9px;

    cursor:
        pointer;

}


.delete-button:hover {

    background:
        #ff0000;

}


/* =========================================================
   LOGIN
========================================================= */

.login-box {

    width:
        min(
            430px,
            100%
        );

    background:
        #101010;

    border:
        3px solid #ff00cc;

    box-shadow:
        7px 7px 0 #00ffff;

    padding:
        30px;

}


.login-title {

    color:
        #00ffff;

    font-size:
        18px;

    margin-bottom:
        30px;

    text-align:
        center;

}


.login-button {

    width:
        100%;

    padding:
        15px;

    border:
        0;

    background:
        #ffffff;

    color:
        #000000;

    font-family:
        inherit;

    font-weight:
        bold;

    cursor:
        pointer;

}


.login-button:hover {

    background:
        #00ffff;

}


.login-error {

    display:
        none;

    color:
        #ff4444;

    margin-bottom:
        15px;

    font-size:
        10px;

    text-align:
        center;

}


/* =========================================================
   ADMIN HEADER
========================================================= */

.admin-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        30px;

}


.logout-button {

    padding:
        9px 12px;

    background:
        #222;

    color:
        #ff4444;

    border:
        1px solid #ff4444;

    font-family:
        inherit;

    font-size:
        9px;

    cursor:
        pointer;

}


.logout-button:hover {

    background:
        #ff4444;

    color:
        white;

}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty {

    grid-column:
        1 / -1;

    text-align:
        center;

    padding:
        70px 20px;

    border:
        2px dashed #333;

    color:
        #555;

    font-size:
        12px;

    line-height:
        2;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    text-align:
        center;

    margin-top:
        80px;

    color:
        #444;

    font-size:
        10px;

    line-height:
        2;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .container {

        padding-top:
            35px;

    }


    .logo {

        font-size:
            52px;

    }


    h1 {

        font-size:
            35px;

    }


    .game-card {

        min-height:
            250px;

    }


    .modal-box {

        padding:
            20px;

    }


    .admin-game {

        align-items:
            flex-start;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     PUBLIC HEADER
===================================================== -->

<header>

    <div class="logo">
        🎮
    </div>

    <h1>
        GAME WORLD
    </h1>

    <div class="subtitle">

        WELCOME TO MY PIXEL UNIVERSE

        <br>

        SELECT A GAME AND ENTER THE WORLD

    </div>

    <div
        class="game-count"
        id="gameCount"
    >
        0 GAMES
    </div>

</header>


<!-- =====================================================
     PUBLIC GAME BOARD
===================================================== -->

<main id="games"></main>


<footer>

    KAISON'S GAME WORLD

    <br>

    © 2026 • ALL GAMES

</footer>


</div>


<!-- =====================================================
     ADMIN BUTTON
===================================================== -->

<button
    class="admin-trigger"
    onclick="openLogin()"
    title="Admin"
>
    ⚙
</button>


<!-- =====================================================
     LOGIN MODAL
===================================================== -->

<div
    class="modal"
    id="loginModal"
>

    <div class="login-box">

        <div class="modal-title">

            <h2>
                ADMIN LOGIN
            </h2>

            <button
                class="close"
                onclick="closeLogin()"
            >
                ×
            </button>

        </div>


        <div
            class="login-error"
            id="loginError"
        >
            INCORRECT USERNAME OR PASSWORD.
        </div>


        <label class="form-label">
            USERNAME
        </label>

        <input
            type="text"
            id="username"
            autocomplete="username"
            placeholder="Username"
        >


        <label class="form-label">
            PASSWORD
        </label>

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Password"
        >


        <button
            class="login-button"
            onclick="login()"
        >
            ENTER ADMIN PANEL
        </button>

    </div>

</div>


<!-- =====================================================
     ADMIN MODAL
===================================================== -->

<div
    class="modal"
    id="adminModal"
>

    <div class="modal-box">

        <div class="admin-header">

            <div>

                <h2
                    style="
                    margin:0;
                    color:#00ffff;
                    font-size:18px;
                    "
                >
                    🎮 GAME ADMIN
                </h2>

            </div>


            <button
                class="logout-button"
                onclick="logout()"
            >
                LOGOUT
            </button>

        </div>


        <!-- GAME NAME -->

        <label class="form-label">
            GAME NAME
        </label>

        <input
            type="text"
            id="newGameName"
            placeholder="Example: Ghost Escape"
        >


        <!-- GAME URL -->

        <label class="form-label">
            GITHUB GAME URL
        </label>

        <input
            type="url"
            id="newGameURL"
            placeholder="https://yourname.github.io/GameWorld/Ghosts.html"
        >


        <!-- EMOJI -->

        <div class="emoji-title">
            SELECT GAME ICON
        </div>


        <div
            class="emoji-grid"
            id="emojiGrid"
        ></div>


        <button
            class="add-button"
            onclick="addGame()"
        >
            + ADD GAME TO WORLD
        </button>


        <!-- CURRENT GAMES -->

        <div class="admin-list">

            <div class="admin-list-title">
                CURRENT GAMES
            </div>


            <div
                id="adminGameList"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   ADMIN LOGIN
========================================================= */

/*
   These are the credentials you requested.

   NOTE:
   Because this is client-side HTML, this is NOT a
   secure password system. Anyone who can inspect the
   source code can technically discover the credentials.

   For a personal/private game dashboard this is okay,
   but do not use this approach for sensitive information.
*/

const ADMIN_USERNAME =
    "Kaison";


const ADMIN_PASSWORD =
    "$NB038180098";


/* =========================================================
   GAME ICONS
========================================================= */

const GAME_ICONS = [

    "🎮",
    "👻",
    "🚀",
    "⚖️",
    "🪞",
    "💣",
    "🪨",
    "🍎",
    "🍓",
    "🍉",
    "🍌",
    "👁️",
    "🧠",
    "🔥",
    "🌌",
    "🛸",
    "🎯",
    "🏃",
    "🧩",
    "⚡",
    "🌙",
    "☀️",
    "💀",
    "👾",
    "🤖",
    "🧟",
    "🧙",
    "🥷",
    "🏆",
    "💎",
    "❤️",
    "💥",
    "🌋",
    "🌊",
    "🏎️",
    "✈️",
    "🚁",
    "🚗",
    "🏹",
    "⚔️",
    "🛡️",
    "🔮",
    "🌀",
    "🛰️",
    "🌍",
    "🌠",
    "☄️",
    "🕹️"

];


/* =========================================================
   DEFAULT GAMES
========================================================= */

const DEFAULT_GAMES = [

    {
        name:
            "First Game",

        url:
            "https://YOURUSERNAME.github.io/GameWorld/First-Game.html",

        icon:
            "🎮"
    },


    {
        name:
            "Space Two",

        url:
            "https://YOURUSERNAME.github.io/GameWorld/Space-Two.html",

        icon:
            "🚀"
    },


    {
        name:
            "Balance Mobile",

        url:
            "https://YOURUSERNAME.github.io/GameWorld/Balance-Mobile.html",

        icon:
            "⚖️"
    },


    {
        name:
            "Ghosts",

        url:
            "https://YOURUSERNAME.github.io/GameWorld/Ghosts.html",

        icon:
            "👻"
    },


    {
        name:
            "Reflection",

        url:
            "https://YOURUSERNAME.github.io/GameWorld/Reflection.html",

        icon:
            "🪞"
    }

];


/* =========================================================
   LOAD GAMES
========================================================= */

let games;


const savedGames =
    localStorage.getItem(
        "kaisonGameWorldGames"
    );


if (savedGames) {

    try {

        games =
            JSON.parse(
                savedGames
            );

    } catch {

        games =
            [...DEFAULT_GAMES];

    }

} else {

    games =
        [...DEFAULT_GAMES];

}


/* =========================================================
   SAVE GAMES
========================================================= */

function saveGames() {

    localStorage.setItem(

        "kaisonGameWorldGames",

        JSON.stringify(
            games
        )

    );

}


/* =========================================================
   DISPLAY PUBLIC GAMES
========================================================= */

function displayGames() {

    const container =
        document.getElementById(
            "games"
        );


    const counter =
        document.getElementById(
            "gameCount"
        );


    container.innerHTML =
        "";


    counter.textContent =
        `${games.length} GAME${games.length === 1 ? "" : "S"}`;


    if (
        games.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                🎮

                <br><br>

                NO GAMES AVAILABLE

            </div>

        `;

        return;

    }


    games.forEach(
        (game, index) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "game-card";


            card.innerHTML = `

                <div
                    class="game-number"
                >
                    #${String(index + 1).padStart(2, "0")}
                </div>


                <div
                    class="game-icon"
                >
                    ${game.icon || "🎮"}
                </div>


                <div
                    class="game-name"
                >
                    ${escapeHTML(game.name)}
                </div>


                <div
                    class="play-button"
                >
                    ▶ PLAY GAME
                </div>

            `;


            card.addEventListener(
                "click",
                function() {

                    window.open(
                        game.url,
                        "_blank"
                    );

                }
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   OPEN LOGIN
========================================================= */

function openLogin() {

    document
        .getElementById(
            "loginModal"
        )
        .classList
        .add("show");


    setTimeout(
        function() {

            document
                .getElementById(
                    "username"
                )
                .focus();

        },
        100
    );

}


/* =========================================================
   CLOSE LOGIN
========================================================= */

function closeLogin() {

    document
        .getElementById(
            "loginModal"
        )
        .classList
        .remove("show");

}


/* =========================================================
   LOGIN
========================================================= */

function login() {

    const username =
        document
            .getElementById(
                "username"
            )
            .value;


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const error =
        document
            .getElementById(
                "loginError"
            );


    if (

        username ===
            ADMIN_USERNAME

        &&

        password ===
            ADMIN_PASSWORD

    ) {

        error.style.display =
            "none";


        document
            .getElementById(
                "loginModal"
            )
            .classList
            .remove("show");


        document
            .getElementById(
                "adminModal"
            )
            .classList
            .add("show");


        document
            .getElementById(
                "username"
            )
            .value =
            "";


        document
            .getElementById(
                "password"
            )
            .value =
            "";


        createEmojiSelector();

        displayAdminGames();

    } else {

        error.style.display =
            "block";

    }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    document
        .getElementById(
            "adminModal"
        )
        .classList
        .remove("show");

}


/* =========================================================
   EMOJI SELECTOR
========================================================= */

let selectedEmoji =
    "🎮";


function createEmojiSelector() {

    const grid =
        document.getElementById(
            "emojiGrid"
        );


    grid.innerHTML =
        "";


    GAME_ICONS.forEach(
        function(emoji) {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "emoji-button";


            if (
                emoji ===
                selectedEmoji
            ) {

                button.classList
                    .add("selected");

            }


            button.textContent =
                emoji;


            button.addEventListener(
                "click",
                function() {

                    selectedEmoji =
                        emoji;


                    document
                        .querySelectorAll(
                            ".emoji-button"
                        )
                        .forEach(
                            btn => {

                                btn.classList
                                    .remove(
                                        "selected"
                                    );

                            }
                        );


                    button.classList
                        .add(
                            "selected"
                        );

                }
            );


            grid.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ADD GAME
========================================================= */

function addGame() {

    const name =
        document
            .getElementById(
                "newGameName"
            )
            .value
            .trim();


    const url =
        document
            .getElementById(
                "newGameURL"
            )
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter a game name."
        );

        return;

    }


    if (!url) {

        alert(
            "Please enter your GitHub game URL."
        );

        return;

    }


    try {

        new URL(url);

    } catch {

        alert(
            "Please enter a valid URL."
        );

        return;

    }


    games.push({

        name:
            name,

        url:
            url,

        icon:
            selectedEmoji

    });


    saveGames();


    document
        .getElementById(
            "newGameName"
        )
        .value =
        "";


    document
        .getElementById(
            "newGameURL"
        )
        .value =
        "";


    selectedEmoji =
        "🎮";


    displayGames();

    displayAdminGames();

    createEmojiSelector();


    alert(
        "🎮 GAME ADDED TO GAME WORLD!"
    );

}


/* =========================================================
   ADMIN GAME LIST
========================================================= */

function displayAdminGames() {

    const container =
        document.getElementById(
            "adminGameList"
        );


    container.innerHTML =
        "";


    if (
        games.length === 0
    ) {

        container.innerHTML = `

            <div
                style="
                color:#666;
                font-size:10px;
                padding:20px 0;
                "
            >
                NO GAMES.
            </div>

        `;

        return;

    }


    games.forEach(
        function(game, index) {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "admin-game";


            row.innerHTML = `

                <div
                    class="admin-game-info"
                >

                    <div
                        class="admin-game-name"
                    >
                        ${game.icon || "🎮"}
                        ${escapeHTML(game.name)}
                    </div>

                    <div
                        class="admin-game-url"
                    >
                        ${escapeHTML(game.url)}
                    </div>

                </div>


                <button
                    class="delete-button"
                    onclick="
                        deleteGame(${index})
                    "
                >
                    DELETE
                </button>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   DELETE GAME
========================================================= */

function deleteGame(index) {

    const game =
        games[index];


    const confirmed =
        confirm(
            `Delete "${game.name}"?`
        );


    if (!confirmed) {

        return;

    }


    games.splice(
        index,
        1
    );


    saveGames();


    displayGames();

    displayAdminGames();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const element =
        document.createElement(
            "div"
        );


    element.textContent =
        text;


    return element.innerHTML;

}


/* =========================================================
   KEYBOARD ENTER LOGIN
========================================================= */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                login();

            }

        }
    );


/* =========================================================
   CLOSE MODALS BY CLICKING OUTSIDE
========================================================= */

document
    .getElementById("loginModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeLogin();

            }

        }
    );


document
    .getElementById("adminModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                logout();

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

displayGames();

</script>
